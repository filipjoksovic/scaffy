name: Deploy API stack to VPS

on:
  push:
    branches:
      - main
    paths:
      - "scaffy-be/**"
      - "scaffy-generator/**"
      - "scaffy-publisher/**"
      - "scaffy-ops/**"
      - ".github/workflows/deploy-vps.yml"
      - ".github/workflows/scaffy-be-build.yml"
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Build and deploy scaffy-be"
        type: boolean
        default: true
      deploy_generator:
        description: "Build and deploy scaffy-generator"
        type: boolean
        default: false
      deploy_publisher:
        description: "Build and deploy scaffy-publisher"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: scaffy-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/scaffy' }}
  HETZNER_PORT: ${{ vars.HETZNER_PORT || '22' }}
  SCAFFY_DOMAIN: ${{ vars.SCAFFY_DOMAIN || 'api.scaffy.fijol.io' }}
  SCAFFY_CORS_ALLOWED_ORIGINS: ${{ vars.SCAFFY_CORS_ALLOWED_ORIGINS || 'https://scaffy.fijol.io' }}
  SCAFFY_APP_FRONTEND_URL: ${{ vars.SCAFFY_APP_FRONTEND_URL || 'https://scaffy.fijol.io' }}
  SCAFFY_AUTH_COOKIE_SAME_SITE: ${{ vars.SCAFFY_AUTH_COOKIE_SAME_SITE || 'None' }}
  SCAFFY_HTTP_PORT: ${{ vars.SCAFFY_HTTP_PORT || '80' }}
  SCAFFY_HTTPS_PORT: ${{ vars.SCAFFY_HTTPS_PORT || '443' }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB || 'scaffy' }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER || 'scaffy' }}
  MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER || vars.MINIO_ROOT_USER || 'scaffy' }}
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
  HETZNER_USER: ${{ secrets.HETZNER_USER }}
  HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
  LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
  SCAFFY_JWT_SECRET: ${{ secrets.SCAFFY_JWT_SECRET }}
  SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET: ${{ secrets.SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET || secrets.SCAFFY_JWT_SECRET }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
  GITLAB_OAUTH_CLIENT_ID: ${{ secrets.GITLAB_OAUTH_CLIENT_ID }}
  GITLAB_OAUTH_CLIENT_SECRET: ${{ secrets.GITLAB_OAUTH_CLIENT_SECRET }}

jobs:
  deploy:
    name: Build, publish, and deploy API stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BACKEND: ${{ inputs.deploy_backend }}
          DISPATCH_GENERATOR: ${{ inputs.deploy_generator }}
          DISPATCH_PUBLISHER: ${{ inputs.deploy_publisher }}
        run: |
          set -euo pipefail
          backend=false
          generator=false
          publisher=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            backend="${DISPATCH_BACKEND:-true}"
            generator="${DISPATCH_GENERATOR:-false}"
            publisher="${DISPATCH_PUBLISHER:-false}"
          elif [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            backend=true
            generator=true
            publisher=true
          else
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            while IFS= read -r file; do
              case "$file" in
                scaffy-be/*|scaffy-ops/docker/scaffy-be.Dockerfile)
                  backend=true
                  ;;
                scaffy-generator/*|scaffy-ops/docker/scaffy-generator.Dockerfile)
                  generator=true
                  ;;
                scaffy-publisher/*|scaffy-ops/docker/scaffy-publisher.Dockerfile)
                  publisher=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "generator=${generator}" >> "$GITHUB_OUTPUT"
          echo "publisher=${publisher}" >> "$GITHUB_OUTPUT"
          pull_services=""
          if [ "$backend" = "true" ]; then
            pull_services="${pull_services} scaffy-be scaffy-analysis-worker"
          fi
          if [ "$generator" = "true" ]; then
            pull_services="${pull_services} scaffy-generator"
          fi
          if [ "$publisher" = "true" ]; then
            pull_services="${pull_services} scaffy-publisher"
          fi
          echo "pull_services=${pull_services# }" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.changes.outputs.backend == 'true'
        timeout-minutes: 3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Test backend
        if: steps.changes.outputs.backend == 'true'
        timeout-minutes: 6
        working-directory: scaffy-be
        run: ./mvnw --batch-mode test

      - name: Prepare image tags
        id: image
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          GENERATOR_CHANGED: ${{ steps.changes.outputs.generator }}
          PUBLISHER_CHANGED: ${{ steps.changes.outputs.publisher }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          be_image="ghcr.io/${repository}/scaffy-be"
          generator_image="ghcr.io/${repository}/scaffy-generator"
          publisher_image="ghcr.io/${repository}/scaffy-publisher"
          echo "be_sha_tag=${be_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "be_latest_tag=${be_image}:latest" >> "$GITHUB_OUTPUT"
          echo "generator_sha_tag=${generator_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "generator_latest_tag=${generator_image}:latest" >> "$GITHUB_OUTPUT"
          echo "publisher_sha_tag=${publisher_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "publisher_latest_tag=${publisher_image}:latest" >> "$GITHUB_OUTPUT"
          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo "be_deploy_tag=${be_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "be_deploy_tag=${be_image}:latest" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GENERATOR_CHANGED" = "true" ]; then
            echo "generator_deploy_tag=${generator_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "generator_deploy_tag=${generator_image}:latest" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PUBLISHER_CHANGED" = "true" ]; then
            echo "publisher_deploy_tag=${publisher_image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "publisher_deploy_tag=${publisher_image}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required deployment config
        run: |
          set -euo pipefail
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY LETSENCRYPT_EMAIL POSTGRES_PASSWORD MINIO_ROOT_PASSWORD SCAFFY_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done
          if [ "${#MINIO_ROOT_USER}" -lt 3 ]; then
            echo "::error::MINIO_ROOT_USER must be at least 3 characters."
            exit 1
          fi
          if [ "${#MINIO_ROOT_PASSWORD}" -lt 8 ]; then
            echo "::error::MINIO_ROOT_PASSWORD must be at least 8 characters."
            exit 1
          fi

      - name: Validate API Compose config
        env:
          SCAFFY_BE_IMAGE: ${{ steps.image.outputs.be_deploy_tag }}
          SCAFFY_GENERATOR_IMAGE: ${{ steps.image.outputs.generator_deploy_tag }}
          SCAFFY_PUBLISHER_IMAGE: ${{ steps.image.outputs.publisher_deploy_tag }}
        run: docker compose -f scaffy-ops/compose.api.yml config >/dev/null

      - name: Log in to GHCR
        if: steps.changes.outputs.pull_services != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.pull_services != ''
        timeout-minutes: 3
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        timeout-minutes: 6
        uses: docker/build-push-action@v6
        with:
          context: ./scaffy-be
          file: ./scaffy-ops/docker/scaffy-be.Dockerfile
          push: true
          cache-from: type=gha,scope=scaffy-be
          cache-to: type=gha,mode=max,scope=scaffy-be
          tags: |
            ${{ steps.image.outputs.be_sha_tag }}
            ${{ steps.image.outputs.be_latest_tag }}

      - name: Build and push generator image
        if: steps.changes.outputs.generator == 'true'
        timeout-minutes: 6
        uses: docker/build-push-action@v6
        with:
          context: ./scaffy-generator
          file: ./scaffy-ops/docker/scaffy-generator.Dockerfile
          push: true
          cache-from: type=gha,scope=scaffy-generator
          cache-to: type=gha,mode=max,scope=scaffy-generator
          tags: |
            ${{ steps.image.outputs.generator_sha_tag }}
            ${{ steps.image.outputs.generator_latest_tag }}

      - name: Build and push publisher image
        if: steps.changes.outputs.publisher == 'true'
        timeout-minutes: 6
        uses: docker/build-push-action@v6
        with:
          context: ./scaffy-publisher
          file: ./scaffy-ops/docker/scaffy-publisher.Dockerfile
          push: true
          cache-from: type=gha,scope=scaffy-publisher
          cache-to: type=gha,mode=max,scope=scaffy-publisher
          tags: |
            ${{ steps.image.outputs.publisher_sha_tag }}
            ${{ steps.image.outputs.publisher_latest_tag }}

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -p "$HETZNER_PORT" -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Write production env file
        env:
          SCAFFY_BE_IMAGE: ${{ steps.image.outputs.be_deploy_tag }}
          SCAFFY_GENERATOR_IMAGE: ${{ steps.image.outputs.generator_deploy_tag }}
          SCAFFY_PUBLISHER_IMAGE: ${{ steps.image.outputs.publisher_deploy_tag }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'SCAFFY_DOMAIN=%s\n' "$SCAFFY_DOMAIN"
            printf 'SCAFFY_BE_IMAGE=%s\n' "$SCAFFY_BE_IMAGE"
            printf 'SCAFFY_GENERATOR_IMAGE=%s\n' "$SCAFFY_GENERATOR_IMAGE"
            printf 'SCAFFY_PUBLISHER_IMAGE=%s\n' "$SCAFFY_PUBLISHER_IMAGE"
            printf 'LETSENCRYPT_EMAIL=%s\n' "$LETSENCRYPT_EMAIL"
            printf 'SCAFFY_CORS_ALLOWED_ORIGINS=%s\n' "$SCAFFY_CORS_ALLOWED_ORIGINS"
            printf 'SCAFFY_APP_FRONTEND_URL=%s\n' "$SCAFFY_APP_FRONTEND_URL"
            printf 'SCAFFY_AUTH_COOKIE_SAME_SITE=%s\n' "$SCAFFY_AUTH_COOKIE_SAME_SITE"
            printf 'SCAFFY_HTTP_PORT=%s\n' "$SCAFFY_HTTP_PORT"
            printf 'SCAFFY_HTTPS_PORT=%s\n' "$SCAFFY_HTTPS_PORT"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'MINIO_ROOT_USER=%s\n' "$MINIO_ROOT_USER"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$MINIO_ROOT_PASSWORD"
            printf 'SCAFFY_JWT_SECRET=%s\n' "$SCAFFY_JWT_SECRET"
            printf 'SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET=%s\n' "$SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET"
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'GITHUB_OAUTH_CLIENT_ID=%s\n' "$GITHUB_OAUTH_CLIENT_ID"
            printf 'GITHUB_OAUTH_CLIENT_SECRET=%s\n' "$GITHUB_OAUTH_CLIENT_SECRET"
            printf 'GITLAB_OAUTH_CLIENT_ID=%s\n' "$GITLAB_OAUTH_CLIENT_ID"
            printf 'GITLAB_OAUTH_CLIENT_SECRET=%s\n' "$GITLAB_OAUTH_CLIENT_SECRET"
          } > /tmp/scaffy.env

      - name: Install Compose files on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "mkdir -p '$DEPLOY_PATH/scaffy-ops'"
          scp -i ~/.ssh/hetzner -P "$HETZNER_PORT" scaffy-ops/compose.api.yml "$HETZNER_USER@$HETZNER_HOST:$DEPLOY_PATH/scaffy-ops/compose.yml"
          scp -i ~/.ssh/hetzner -P "$HETZNER_PORT" /tmp/scaffy.env "$HETZNER_USER@$HETZNER_HOST:$DEPLOY_PATH/scaffy-ops/.env"

      - name: Pull and restart backend stack
        timeout-minutes: 5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_SERVICES: ${{ steps.changes.outputs.pull_services }}
        run: |
          set -euo pipefail
          if [ -n "$PULL_SERVICES" ]; then
            printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          fi
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "cd '$DEPLOY_PATH/scaffy-ops' && if [ -n '$PULL_SERVICES' ]; then time docker compose pull $PULL_SERVICES && docker compose images $PULL_SERVICES; fi && docker compose up -d --remove-orphans traefik postgres redis minio minio-bucket scaffy-be scaffy-analysis-worker scaffy-generator scaffy-publisher && docker compose ps"

name: Deploy backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "scaffy-be/**"
      - "scaffy-ops/**"
      - ".github/workflows/deploy-vps.yml"
      - ".github/workflows/scaffy-be-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: scaffy-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/scaffy' }}
  HETZNER_PORT: ${{ vars.HETZNER_PORT || '22' }}
  SCAFFY_DOMAIN: ${{ vars.SCAFFY_DOMAIN || 'api.scaffy.fijol.io' }}
  SCAFFY_CORS_ALLOWED_ORIGINS: ${{ vars.SCAFFY_CORS_ALLOWED_ORIGINS || 'https://scaffy.fijol.io' }}
  SCAFFY_HTTP_PORT: ${{ vars.SCAFFY_HTTP_PORT || '80' }}
  SCAFFY_HTTPS_PORT: ${{ vars.SCAFFY_HTTPS_PORT || '443' }}
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
  HETZNER_USER: ${{ secrets.HETZNER_USER }}
  HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
  LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}

jobs:
  deploy:
    name: Build, publish, and deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test backend
        working-directory: scaffy-be
        run: ./mvnw --batch-mode test

      - name: Prepare image tags
        id: image
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/scaffy-be"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Validate required deployment config
        run: |
          set -euo pipefail
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY LETSENCRYPT_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Validate API Compose config
        env:
          SCAFFY_BE_IMAGE: ${{ steps.image.outputs.sha_tag }}
        run: docker compose -f scaffy-ops/compose.api.yml config >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./scaffy-be
          file: ./scaffy-ops/docker/scaffy-be.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -p "$HETZNER_PORT" -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Write production env file
        env:
          SCAFFY_BE_IMAGE: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'SCAFFY_DOMAIN=%s\n' "$SCAFFY_DOMAIN"
            printf 'SCAFFY_BE_IMAGE=%s\n' "$SCAFFY_BE_IMAGE"
            printf 'LETSENCRYPT_EMAIL=%s\n' "$LETSENCRYPT_EMAIL"
            printf 'SCAFFY_CORS_ALLOWED_ORIGINS=%s\n' "$SCAFFY_CORS_ALLOWED_ORIGINS"
            printf 'SCAFFY_HTTP_PORT=%s\n' "$SCAFFY_HTTP_PORT"
            printf 'SCAFFY_HTTPS_PORT=%s\n' "$SCAFFY_HTTPS_PORT"
          } > /tmp/scaffy.env

      - name: Install Compose files on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "mkdir -p '$DEPLOY_PATH/scaffy-ops'"
          scp -i ~/.ssh/hetzner -P "$HETZNER_PORT" scaffy-ops/compose.api.yml "$HETZNER_USER@$HETZNER_HOST:$DEPLOY_PATH/scaffy-ops/compose.yml"
          scp -i ~/.ssh/hetzner -P "$HETZNER_PORT" /tmp/scaffy.env "$HETZNER_USER@$HETZNER_HOST:$DEPLOY_PATH/scaffy-ops/.env"

      - name: Pull and restart backend stack
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "cd '$DEPLOY_PATH/scaffy-ops' && docker compose pull scaffy-be && docker compose up -d --remove-orphans traefik scaffy-be && docker compose ps"

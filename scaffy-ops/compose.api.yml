services:
  traefik:
    image: traefik:v3.6.15
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${SCAFFY_HTTP_PORT:-80}:80"
      - "${SCAFFY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - scaffy

  scaffy-be:
    image: ${SCAFFY_BE_IMAGE:?Set SCAFFY_BE_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SCAFFY_CORS_ALLOWED_ORIGINS: ${SCAFFY_CORS_ALLOWED_ORIGINS:-}
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.scaffy-be.rule=Host(`${SCAFFY_DOMAIN:?Set SCAFFY_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.scaffy-be.entrypoints=websecure
      - traefik.http.routers.scaffy-be.priority=100
      - traefik.http.routers.scaffy-be.tls.certresolver=letsencrypt
      - traefik.http.services.scaffy-be.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - scaffy

networks:
  scaffy:
    driver: bridge

volumes:
  traefik-letsencrypt:

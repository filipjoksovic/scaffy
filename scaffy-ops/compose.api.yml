services:
  traefik:
    image: traefik:v3.6.15
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${SCAFFY_HTTP_PORT:-80}:80"
      - "${SCAFFY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - scaffy

  scaffy-be:
    image: ${SCAFFY_BE_IMAGE:?Set SCAFFY_BE_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-bucket:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scaffy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scaffy}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SCAFFY_CORS_ALLOWED_ORIGINS: ${SCAFFY_CORS_ALLOWED_ORIGINS:-}
      SCAFFY_APP_FRONTEND_URL: ${SCAFFY_APP_FRONTEND_URL:?Set SCAFFY_APP_FRONTEND_URL}
      SCAFFY_JWT_SECRET: ${SCAFFY_JWT_SECRET:?Set SCAFFY_JWT_SECRET}
      SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET: ${SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET:-${SCAFFY_JWT_SECRET}}
      SCAFFY_AUTH_COOKIE_SECURE: ${SCAFFY_AUTH_COOKIE_SECURE:-true}
      SCAFFY_AUTH_COOKIE_SAME_SITE: ${SCAFFY_AUTH_COOKIE_SAME_SITE:-None}
      SCAFFY_AUTH_COOKIE_DOMAIN: ${SCAFFY_AUTH_COOKIE_DOMAIN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      SCAFFY_REDIS_HOST: redis
      SCAFFY_REDIS_PORT: 6379
      SCAFFY_INIT_QUEUE_ENABLED: "true"
      SCAFFY_INIT_QUEUE_NAME: ${SCAFFY_INIT_QUEUE_NAME:-scaffy:init-jobs}
      SCAFFY_REPOSITORY_PUBLICATION_QUEUE_ENABLED: "true"
      SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME: ${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME:-scaffy:repo-publication-jobs}
      SCAFFY_INIT_STORAGE_ENABLED: "true"
      SCAFFY_INIT_STORAGE_ENDPOINT: http://minio:9000
      SCAFFY_INIT_STORAGE_BUCKET: ${SCAFFY_INIT_STORAGE_BUCKET:-scaffy-initializer}
      SCAFFY_INIT_STORAGE_REGION: ${SCAFFY_INIT_STORAGE_REGION:-us-east-1}
      SCAFFY_INIT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-scaffy}
      SCAFFY_INIT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scaffy-secret}
      SCAFFY_INIT_STORAGE_PATH_STYLE: "true"
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.scaffy-be.rule=Host(`${SCAFFY_DOMAIN:?Set SCAFFY_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/oauth2`) || PathPrefix(`/login/oauth2`))
      - traefik.http.routers.scaffy-be.entrypoints=websecure
      - traefik.http.routers.scaffy-be.priority=100
      - traefik.http.routers.scaffy-be.tls.certresolver=letsencrypt
      - traefik.http.services.scaffy-be.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - scaffy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scaffy}
      POSTGRES_USER: ${POSTGRES_USER:-scaffy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - scaffy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaffy} -d ${POSTGRES_DB:-scaffy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scaffy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - scaffy-redis:/data
    networks:
      - scaffy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scaffy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - scaffy-minio:/data
    networks:
      - scaffy

  minio-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-scaffy} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}; do sleep 2; done
        mc mb --ignore-existing local/${SCAFFY_INIT_STORAGE_BUCKET:-scaffy-initializer}
    networks:
      - scaffy

  scaffy-generator:
    image: ${SCAFFY_GENERATOR_IMAGE:?Set SCAFFY_GENERATOR_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scaffy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scaffy}
      REDIS_URL: redis://redis:6379
      SCAFFY_INIT_QUEUE_NAME: ${SCAFFY_INIT_QUEUE_NAME:-scaffy:init-jobs}
      SCAFFY_INIT_STORAGE_ENDPOINT: http://minio:9000
      SCAFFY_INIT_STORAGE_BUCKET: ${SCAFFY_INIT_STORAGE_BUCKET:-scaffy-initializer}
      SCAFFY_INIT_STORAGE_REGION: ${SCAFFY_INIT_STORAGE_REGION:-us-east-1}
      SCAFFY_INIT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-scaffy}
      SCAFFY_INIT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      SCAFFY_INIT_STORAGE_PATH_STYLE: "true"
      SCAFFY_GENERATOR_MODE: ${SCAFFY_GENERATOR_MODE:-runtime}
    networks:
      - scaffy

  scaffy-publisher:
    image: ${SCAFFY_PUBLISHER_IMAGE:?Set SCAFFY_PUBLISHER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scaffy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scaffy}
      REDIS_URL: redis://redis:6379
      SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME: ${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME:-scaffy:repo-publication-jobs}
      SCAFFY_INIT_STORAGE_ENDPOINT: http://minio:9000
      SCAFFY_INIT_STORAGE_BUCKET: ${SCAFFY_INIT_STORAGE_BUCKET:-scaffy-initializer}
      SCAFFY_INIT_STORAGE_REGION: ${SCAFFY_INIT_STORAGE_REGION:-us-east-1}
      SCAFFY_INIT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-scaffy}
      SCAFFY_INIT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      SCAFFY_INIT_STORAGE_PATH_STYLE: "true"
      SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET: ${SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET:-${SCAFFY_JWT_SECRET:?Set SCAFFY_JWT_SECRET}}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    networks:
      - scaffy

networks:
  scaffy:
    driver: bridge

volumes:
  traefik-letsencrypt:
  scaffy-postgres:
  scaffy-redis:
  scaffy-minio:

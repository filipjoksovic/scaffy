services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scaffy}
      POSTGRES_USER: ${POSTGRES_USER:-scaffy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scaffy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scaffy-postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaffy} -d ${POSTGRES_DB:-scaffy}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scaffy-postgres-local:

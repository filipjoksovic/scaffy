server.port=8080

scaffy.cors.allowed-origins=http://localhost:5173
scaffy.app.frontend-url=${SCAFFY_APP_FRONTEND_URL:http://localhost:5173}
scaffy.auth.jwt-secret=${SCAFFY_JWT_SECRET:local-development-secret-change-before-sharing}
scaffy.auth.cookie-secure=false
scaffy.auth.cookie-same-site=Lax
scaffy.auth.cookie-domain=
scaffy.auth.provider-token-encryption-secret=${SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET:${SCAFFY_JWT_SECRET:local-development-secret-change-before-sharing}}
scaffy.auth.access-token-ttl-seconds=${SCAFFY_AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scaffy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scaffy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scaffy}

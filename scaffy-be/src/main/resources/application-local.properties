server.port=8080

scaffy.cors.allowed-origins=http://localhost:5173
scaffy.app.frontend-url=${SCAFFY_APP_FRONTEND_URL:http://localhost:5173}
scaffy.auth.jwt-secret=${SCAFFY_JWT_SECRET:local-development-secret-change-before-sharing}
scaffy.auth.cookie-secure=false
scaffy.auth.cookie-same-site=Lax
scaffy.auth.cookie-domain=
scaffy.auth.provider-token-encryption-secret=${SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET:${SCAFFY_JWT_SECRET:local-development-secret-change-before-sharing}}
scaffy.auth.access-token-ttl-seconds=${SCAFFY_AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5544/scaffy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scaffy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scaffy}

spring.data.redis.host=${SCAFFY_REDIS_HOST:localhost}
spring.data.redis.port=${SCAFFY_REDIS_PORT:6379}
scaffy.init.queue.enabled=${SCAFFY_INIT_QUEUE_ENABLED:true}
scaffy.init.queue.name=${SCAFFY_INIT_QUEUE_NAME:scaffy:init-jobs}
scaffy.repository.publication.queue.enabled=${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_ENABLED:true}
scaffy.repository.publication.queue.name=${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME:scaffy:repo-publication-jobs}
scaffy.repository.analysis.queue.enabled=${SCAFFY_REPOSITORY_ANALYSIS_QUEUE_ENABLED:true}
scaffy.repository.analysis.queue.name=${SCAFFY_REPOSITORY_ANALYSIS_QUEUE_NAME:scaffy:repository-analysis-jobs}
scaffy.repository.analysis.worker.enabled=${SCAFFY_REPOSITORY_ANALYSIS_WORKER_ENABLED:false}
scaffy.init.storage.enabled=${SCAFFY_INIT_STORAGE_ENABLED:true}
scaffy.init.storage.bucket=${SCAFFY_INIT_STORAGE_BUCKET:scaffy-initializer}
scaffy.init.storage.region=${SCAFFY_INIT_STORAGE_REGION:us-east-1}
scaffy.init.storage.endpoint=${SCAFFY_INIT_STORAGE_ENDPOINT:http://localhost:9000}
scaffy.init.storage.access-key=${SCAFFY_INIT_STORAGE_ACCESS_KEY:scaffy}
scaffy.init.storage.secret-key=${SCAFFY_INIT_STORAGE_SECRET_KEY:scaffy-secret}
scaffy.init.storage.path-style-access=${SCAFFY_INIT_STORAGE_PATH_STYLE:true}

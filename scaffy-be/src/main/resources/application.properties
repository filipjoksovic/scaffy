spring.application.name=scaffy-be
scaffy.cors.allowed-origins=https://scaffy-seven.vercel.app,http://localhost:5173
scaffy.app.frontend-url=${SCAFFY_APP_FRONTEND_URL:http://localhost:5173}
scaffy.auth.jwt-secret=${SCAFFY_JWT_SECRET:change-this-secret-before-deploying-scaffy}
scaffy.auth.cookie-secure=${SCAFFY_AUTH_COOKIE_SECURE:false}
scaffy.auth.cookie-same-site=${SCAFFY_AUTH_COOKIE_SAME_SITE:Lax}
scaffy.auth.cookie-domain=${SCAFFY_AUTH_COOKIE_DOMAIN:}
scaffy.auth.provider-token-encryption-secret=${SCAFFY_PROVIDER_TOKEN_ENCRYPTION_SECRET:${SCAFFY_JWT_SECRET:change-this-secret-before-deploying-scaffy}}
scaffy.auth.access-token-ttl-seconds=${SCAFFY_AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
scaffy.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
scaffy.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
scaffy.oauth.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
scaffy.oauth.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
scaffy.oauth.gitlab.client-id=${GITLAB_OAUTH_CLIENT_ID:}
scaffy.oauth.gitlab.client-secret=${GITLAB_OAUTH_CLIENT_SECRET:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scaffy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scaffy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scaffy}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

spring.data.redis.host=${SCAFFY_REDIS_HOST:localhost}
spring.data.redis.port=${SCAFFY_REDIS_PORT:6379}
scaffy.init.queue.enabled=${SCAFFY_INIT_QUEUE_ENABLED:false}
scaffy.init.queue.name=${SCAFFY_INIT_QUEUE_NAME:scaffy:init-jobs}
scaffy.repository.publication.queue.enabled=${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_ENABLED:false}
scaffy.repository.publication.queue.name=${SCAFFY_REPOSITORY_PUBLICATION_QUEUE_NAME:scaffy:repo-publication-jobs}
scaffy.init.storage.enabled=${SCAFFY_INIT_STORAGE_ENABLED:false}
scaffy.init.storage.bucket=${SCAFFY_INIT_STORAGE_BUCKET:scaffy-initializer}
scaffy.init.storage.region=${SCAFFY_INIT_STORAGE_REGION:us-east-1}
scaffy.init.storage.access-key=${SCAFFY_INIT_STORAGE_ACCESS_KEY:scaffy}
scaffy.init.storage.secret-key=${SCAFFY_INIT_STORAGE_SECRET_KEY:scaffy-secret}
scaffy.init.storage.path-style-access=${SCAFFY_INIT_STORAGE_PATH_STYLE:true}

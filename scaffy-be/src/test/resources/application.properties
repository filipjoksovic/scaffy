spring.datasource.url=jdbc:h2:mem:scaffy-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
scaffy.auth.jwt-secret=test-secret-with-enough-length-for-hmac-signing
scaffy.auth.cookie-secure=false
scaffy.auth.cookie-same-site=Lax
scaffy.auth.cookie-domain=
scaffy.auth.provider-token-encryption-secret=test-provider-token-encryption-secret
scaffy.auth.access-token-ttl-seconds=3600
scaffy.auth.refresh-token-ttl-seconds=2592000
scaffy.app.frontend-url=http://localhost:5173

# Intentional anti-pattern fixture: hardcoded credentials are inlined
# to demonstrate detection of HARDCODED_SECRET / secret-in-VCS smells.
# DO NOT copy this layout into a real pipeline.
name: Workflow with hardcoded secret

on:
  push:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_TOKEN: "EXAMPLE_HARDCODED_TOKEN_DO_NOT_USE"
      DATABASE_PASSWORD: "EXAMPLE_DB_PASSWORD_DO_NOT_USE"
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with inline credentials
        run: |
          curl -H "Authorization: Bearer ${API_TOKEN}" https://api.example.com/deploy
          PGPASSWORD="${DATABASE_PASSWORD}" psql -h db.example.com -U deployer -c "SELECT 1"

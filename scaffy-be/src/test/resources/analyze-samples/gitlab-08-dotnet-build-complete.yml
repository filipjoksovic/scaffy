stages:
  - build

build-api:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - dotnet restore
    - dotnet publish src/App/App.csproj --configuration Release --output publish
  artifacts:
    paths:
      - publish/
